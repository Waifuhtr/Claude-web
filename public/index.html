<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#0d1117" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Agent Web</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161b22'/%3E%3Cpath d='M18 22l12 10-12 10M34 44h14' fill='none' stroke='%2358a6ff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
<link rel="stylesheet" href="/vendor/lib/highlight.css" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>Oturumlar</span>
        <div class="header-actions">
          <button id="closeSidebarBtn" class="icon-btn mobile-only" aria-label="Menüyü kapat">✕</button>
          <button id="logoutBtn">Çıkış</button>
        </div>
      </div>
      <div class="session-list" id="sessionList"></div>
      <form class="new-session" id="newSessionForm">
        <input type="text" id="newSessionName" placeholder="yeni-oturum-adi" maxlength="32" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <button type="submit" aria-label="Oturum ekle">+</button>
      </form>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn hamburger-btn" aria-label="Oturum menüsünü aç">☰</button>
        <div class="title-wrap">
          <span class="label" id="activeSessionLabel">Bir oturum seçin</span>
          <span class="run-dot" id="runDot" hidden></span>
        </div>
        <div class="view-switch" id="viewSwitch" hidden>
          <button type="button" data-view="chat" class="active" aria-label="Sohbet" title="Sohbet">
            <svg class="vs-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.5L3 21l2-5.3A8.5 8.5 0 1 1 21 11.5z" /></svg>
            <span class="vs-text">Sohbet</span>
          </button>
          <button type="button" data-view="terminal" aria-label="Terminal" title="Terminal">
            <svg class="vs-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8" /></svg>
            <span class="vs-text">Terminal</span>
          </button>
          <button type="button" data-view="screen" aria-label="Ekran" title="Ekran" hidden>
            <svg class="vs-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2" /><path d="M8 21h8M12 17v4" /></svg>
            <span class="vs-text">Ekran</span>
          </button>
        </div>
        <button type="button" id="newChatBtn" class="icon-btn always" aria-label="Yeni sohbet" title="Yeni sohbet" hidden>✎</button>
      </header>

      <div class="empty-state" id="emptyState">
        <p>Soldan bir oturum açın ya da yeni bir isim yazıp <strong>+</strong> ile oluşturun.</p>
      </div>

      <section class="view chat-view" id="chatView" hidden>
        <div class="chat-scroll" id="chatScroll">
          <div class="chat-list" id="chatList"></div>
        </div>
        <div class="composer-wrap">
          <button type="button" class="jump-btn" id="jumpBtn" aria-label="En alta in" hidden>↓</button>
          <div class="rate-banner" id="rateBanner" hidden></div>
          <div class="live-note" id="liveNote" hidden></div>
          <div class="turn-status" id="turnStatus" aria-live="polite" hidden></div>
          <form class="composer" id="composer">
            <div class="attach-list" id="attachList" hidden></div>
            <textarea id="promptInput" rows="1" placeholder="Claude'a bir şey yaz…" enterkeyhint="enter"></textarea>
            <div class="composer-row">
              <button type="button" class="attach-btn" id="attachBtn" aria-label="Dosya veya görsel ekle" title="Dosya veya görsel ekle">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" /></svg>
              </button>
              <button type="button" class="pill" id="modelPill" aria-label="Model ve effort seç"></button>
              <button type="button" class="pill" id="modePill" aria-label="İzin modunu seç"></button>
              <span class="spacer"></span>
              <button type="submit" class="send-btn" id="sendBtn" aria-label="Gönder" disabled>↑</button>
            </div>
            <input type="file" id="fileInput" multiple hidden />
          </form>
        </div>
      </section>

      <section class="view terminal-view" id="terminalView" hidden>
        <div class="term-container" id="termContainer">
          <div id="terminal"></div>
        </div>
        <div class="key-toolbar" id="keyToolbar">
          <button type="button" data-key="esc">Esc</button>
          <button type="button" data-key="tab">Tab</button>
          <button type="button" data-key="ctrlc" aria-label="Ctrl+C">^C</button>
          <button type="button" data-key="left" aria-label="Sol ok">←</button>
          <button type="button" data-key="up" aria-label="Yukarı ok">↑</button>
          <button type="button" data-key="down" aria-label="Aşağı ok">↓</button>
          <button type="button" data-key="right" aria-label="Sağ ok">→</button>
          <button type="button" data-key="enter" aria-label="Enter">↵</button>
        </div>
      </section>

      <section class="view screen-view" id="screenView" hidden>
        <div class="screen-stage" id="screenStage">
          <div class="screen-canvas" id="screenCanvas"></div>
          <div class="screen-overlay" id="screenOverlay">
            <div class="screen-overlay-box">
              <span class="screen-spinner" id="screenSpinner" aria-hidden="true"></span>
              <p class="screen-msg" id="screenMsg" aria-live="polite">Ekran hazırlanıyor…</p>
              <button type="button" class="btn primary" id="screenRetryBtn" hidden>Yeniden bağlan</button>
            </div>
          </div>
          <div class="screen-toast" id="screenToast" role="status" hidden></div>
        </div>
        <form class="screen-type" id="screenTypeForm" hidden>
          <input type="text" id="screenTypeInput" placeholder="Ekrana yazılacak metin" maxlength="2000" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Ekrana yazılacak metin" />
          <button type="submit" class="btn primary small">Yaz</button>
          <button type="button" class="btn ghost small" id="screenPasteBtn" title="Metni uzak panoya koyup Ctrl+V ile yapıştırır">Yapıştır</button>
        </form>
        <div class="screen-keys" id="screenKeys" hidden>
          <button type="button" data-mod="ctrl" aria-pressed="false">Ctrl</button>
          <button type="button" data-mod="alt" aria-pressed="false">Alt</button>
          <button type="button" data-mod="shift" aria-pressed="false">Shift</button>
          <button type="button" data-key="Escape">Esc</button>
          <button type="button" data-key="Tab">Tab</button>
          <button type="button" data-key="BackSpace" aria-label="Geri sil">⌫</button>
          <button type="button" data-key="Delete">Del</button>
          <button type="button" data-key="Return" aria-label="Enter">↵</button>
          <button type="button" data-key="Left" aria-label="Sol ok">←</button>
          <button type="button" data-key="Up" aria-label="Yukarı ok">↑</button>
          <button type="button" data-key="Down" aria-label="Aşağı ok">↓</button>
          <button type="button" data-key="Right" aria-label="Sağ ok">→</button>
          <button type="button" data-key="F5">F5</button>
        </div>
        <div class="screen-bar" id="screenBar">
          <span class="screen-dot busy" id="screenDot" aria-hidden="true"></span>
          <button type="button" id="screenKeyboardBtn" aria-pressed="false">Klavye</button>
          <button type="button" id="screenKeysBtn" aria-pressed="false">Tuşlar</button>
          <button type="button" id="screenZoomBtn">1:1</button>
          <span class="spacer"></span>
          <button type="button" id="screenMenuBtn">Menü</button>
        </div>
      </section>
    </main>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-label="Model ayarları" hidden></div>
  <div class="sheet-backdrop" id="screenSheetBackdrop" hidden></div>
  <div class="sheet" id="screenSheet" role="dialog" aria-modal="true" aria-label="Ekran menüsü" hidden></div>

  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/xterm-addon-fit/lib/addon-fit.js"></script>
  <script src="/vendor/lib/marked.js"></script>
  <script src="/vendor/lib/purify.js"></script>
  <script src="/vendor/lib/highlight.js"></script>
  <script src="/chat.js"></script>
  <script src="/app.js"></script>
  <script type="module" src="/screen.js"></script>
</body>
</html>
